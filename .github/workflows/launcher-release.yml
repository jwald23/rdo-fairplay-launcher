name: Launcher release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: launcher-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'jwald23/rdo-fairplay-launcher'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test
        run: ./scripts/Verify.ps1
      - name: Package self-contained launcher
        env:
          RELEASE_VERSION: 0.2.${{ github.run_number }}
        run: ./scripts/Publish.ps1 -Version $env:RELEASE_VERSION
      - name: Smoke-test packaged executable
        env:
          RELEASE_VERSION: 0.2.${{ github.run_number }}
        run: |
          $exe = Join-Path $PWD "artifacts/releases/$env:RELEASE_VERSION/RDOFairPlay/RDOFairPlay.exe"
          $process = Start-Process -FilePath $exe -ArgumentList '--render-preview','--small' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(30000)) { throw 'Packaged launcher timed out' }
          if ($process.ExitCode -ne 0) { throw 'Packaged launcher failed its startup checks' }
      - name: Install installer compiler
        run: |
          $compilers = @((Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'), (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'))
          if (-not ($compilers | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build Windows installer
        env:
          RELEASE_VERSION: 0.2.${{ github.run_number }}
        run: ./scripts/Build-Installer.ps1 -Version $env:RELEASE_VERSION
      - name: Test installer lifecycle
        env:
          RELEASE_VERSION: 0.2.${{ github.run_number }}
        run: ./scripts/Test-Installer.ps1 -Version $env:RELEASE_VERSION
      - name: Record download hashes and dependency advisories
        env:
          RELEASE_VERSION: 0.2.${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/Write-DownloadEvidence.ps1 -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT -BuildUrl $env:BUILD_URL
      - name: Keep optional verification records
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-0.2.${{ github.run_number }}
          retention-days: 90
          path: |
            artifacts/releases/0.2.${{ github.run_number }}/DOWNLOAD-EVIDENCE.*
            artifacts/releases/0.2.${{ github.run_number }}/DEPENDENCY-AUDIT.json
            artifacts/releases/0.2.${{ github.run_number }}/SHA256SUMS.txt
      - name: Attest download provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/releases/0.2.${{ github.run_number }}/RDOFairPlay-Setup-Windows-x64.exe
      - name: Verify download provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: 0.2.${{ github.run_number }}
          GH_REPO: ${{ github.repository }}
        run: |
          foreach ($name in @('RDOFairPlay-Setup-Windows-x64.exe')) {
            gh attestation verify "artifacts/releases/$env:RELEASE_VERSION/$name" --repo $env:GH_REPO --signer-workflow "$env:GH_REPO/.github/workflows/launcher-release.yml"
            if ($LASTEXITCODE -ne 0) { throw "Provenance verification failed: $name" }
          }
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: 0.2.${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
          ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          $folder = "artifacts/releases/$env:RELEASE_VERSION"
          $previous = gh release view --json tagName --jq .tagName 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $previous -ne $tag) { "$previous..$env:RELEASE_COMMIT" } else { $env:RELEASE_COMMIT }
          $changes = @(git log $range --no-merges --format="- %s" -20)
          if ($LASTEXITCODE -ne 0 -or -not $changes.Count) { throw 'Could not determine release changes.' }
          $changes | Set-Content "$folder/CHANGES.md" -Encoding utf8NoBOM
          ./scripts/Write-ReleaseNotes.ps1 -Version $env:RELEASE_VERSION -BuildUrl $env:BUILD_URL -AttestationUrl $env:ATTESTATION_URL
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { Write-Host 'Release already published; preserving its assets.'; exit 0 }
          } else {
            gh release create $tag --draft --target $env:RELEASE_COMMIT --title "RDO FairPlay $env:RELEASE_VERSION" --notes-file "$folder/RELEASE-NOTES.md"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag "$folder/RDOFairPlay-Setup-Windows-x64.exe" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
